<!doctype html>
<!-- Emscripten page template: `--shell-file` in the Makefile -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teleport!</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #ccc;
      font: 16px/1.4 monospace;
    }

    /* Fit the 16:9 frame into the viewport, the canvas keeps its pixels */
    canvas {
      position: absolute;
      inset: 0;
      margin: auto;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      outline: none;
    }

    #status {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: pre;
    }
  </style>
</head>

<body>
  <canvas id="canvas" tabindex="-1"></canvas>
  <div id="status">Loading…</div>

  <script>
    const status = document.getElementById("status");

    var Module = {
      canvas: document.getElementById("canvas"),

      // Emscripten reports download and startup progress here
      setStatus(text) {
        status.textContent = text;
        status.hidden = !text;
      },

      onAbort(reason) {
        Module.setStatus("Crashed: " + reason + "\nSee the console");
      },
    };
  </script>

  {{{ SCRIPT }}}
</body>
</html>
